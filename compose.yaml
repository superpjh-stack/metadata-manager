name: metadata-manager
services:
  app:
    build: .
    image: metadata-manager:latest
    container_name: metadata-manager-app
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DEBUG: "0"
      DB_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
      TRUST_PROXY: "1"
      SECURE_SSL_REDIRECT: "1"
    volumes:
      - ./data:/data
    expose:
      - "8000"
    networks:
      - gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz/',headers={'Host':'localhost'})); assert r.status == 200"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  gateway:
    external: true
    name: ${GATEWAY_NETWORK:-rodem-mes_mesnet}
